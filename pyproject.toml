[project]
name = "mlops-hw5"
version = "0.1.0"
description = "MLOPS-26, домашняя работа 5: первый LoRA-ран на своём датасете"
requires-python = ">=3.12"
# Нижние границы, точные версии фиксирует uv.lock.
# peft>=0.14 — layers_to_transform и save_pretrained без лишних модулей.
dependencies = [
    "torch>=2.5",
    "transformers>=4.51",
    "peft>=0.14",
    "numpy>=2.1",
    "pyyaml>=6.0",
    "matplotlib>=3.9",
    "psutil>=5.9",
]

# torch — CUDA-сборка под RTX 3050 (машина сдающего): без этого uv ставит
# процессорный wheel с PyPI и обучение идёт на CPU.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
