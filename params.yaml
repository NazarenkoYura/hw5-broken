# Единственная точка конфигурации ДЗ 5. В src/ нет ни имени модели,
# ни learning rate, ни путей.
model:
  name: "Qwen/Qwen3-0.6B"
  device: "auto"            # auto | cpu | cuda | mps
  # Базовые веса в bfloat16: они заморожены, точность им не нужна, а память
  # и время уходят вдвое. Сами матрицы LoRA peft держит в float32 — там идут
  # крошечные обновления AdamW. На старом CPU без bf16 ставьте float32.
  dtype: "bfloat16"
  enable_thinking: false    # как в ДЗ 4: шаблон должен совпадать с обучением

data:
  # Выход стадии tokenize из ДЗ 4. У студента — свой путь.
  train: "data/tokenized/train.pt"
  val: "data/tokenized/val.pt"

lora:
  r: 8
  alpha: 16                 # итоговый масштаб апдейта alpha / r = 2
  dropout: 0.05
  # Только проекции внимания и MLP. embed_tokens и lm_head — это 155 млн
  # параметров каждый; в modules_to_save они уезжают в адаптер целиком.
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]

train:
  seed: 42
  epochs: 1
  # Видеокарта сдающего — 4 ГБ: логиты на батч 2 x 2048 токенов занимают
  # 1,2 ГБ в bf16 и ещё 2,5 ГБ во float32-копии для лосса — не влезает.
  # Поэтому батч 1, а эффективный батч 8 собираем накоплением градиента.
  batch_size: 1
  grad_accum: 8             # эффективный батч = 8: память как у батча 1, шаг как у батча 8
  lr: 2.0e-4                # эталон лекции; 1.0e-2 расшатывает обучение — train loss взлетает до десятков
  warmup_ratio: 0.03
  weight_decay: 0.0
  max_grad_norm: 1.0
  eval_every: 10            # шагов оптимизатора между замерами val loss
  # Полный val (593 примера) на этой машине — десятки минут на один замер,
  # таких замеров ~60. Для кривой берём детерминированное начало сплита.
  val_limit: 96
  eval_batch_size: 1        # логиты даже одного примера на 2048 токенах — ~1,9 ГБ
  gradient_checkpointing: true   # без него на ноутбуке с 16–32 ГБ не влезает
  # 240 из 593 шагов полной эпохи: на этой машине (4 ГБ GPU, батч 1) полный
  # проход занял бы ~11 часов на оба варианта. Основное падение val — в первых
  # шагах (лекция), кривая сходимости и числа для дефектов получаются и на
  # укороченном прогоне. Подробности — work_log.md.
  max_steps: 240

# Эксперимент по слоям: второй прогон без адаптеров на первых N слоях.
variants:
  - name: "all_layers"
    freeze_first: 0
  - name: "freeze14"
    freeze_first: 14

compare:
  max_new_tokens: 40
  # Пять фиксированных промптов: одни и те же для базовой модели и адаптера.
  # Формат и система — как в своём датасете (ДЗ 3/4): тема, заголовок и текст
  # вопроса со Stack Exchange по статистике; адаптер учился отвечать именно
  # на такие реплики, поэтому сравнение показывает его на своей задаче.
  prompts:
    - "Тема:\ndistributions\n\nВопрос:\nFinding the PDF given the CDF\n\nHow can I find the PDF (probability density function) of a distribution given the CDF (cumulative distribution function)?"
    - "Тема:\np-value\n\nВопрос:\nIs a p-value a sample statistic, or a population parameter, or neither?\n\nI would also be interested to know why it is one or the other."
    - "Тема:\ndata-visualization\n\nВопрос:\nExplain data visualization\n\nHow would you explain data visualization and why it is important to a layman?"
    - "Тема:\nstandard-deviation\n\nВопрос:\nLog graph question\n\nSo let's say you have a distribution where X is the 16% quantile. Then you take the log of all the values of the distribution. Would log(X) still be the 16% quantile in the log distribution?"
    - "Тема:\ncross-validation\n\nВопрос:\nTechniques that use the addition of noise to training data\n\nI was curious if there is a class of techniques that uses addition of noise to training data to help prevent overfitting of data."
  system: "Ты отвечаешь на вопросы по статистике и машинному обучению. Дан вопрос пользователя; дай точный ответ по существу, при необходимости с формулой или примером кода."

paths:
  models: "models"
  metrics: "metrics"
  curves: "docs/curves.png"
  compare: "docs/compare.md"
